<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Eat Orange — Snake Escape</title>
<style>
  :root{
    --bg:#0b1220; --panel:#0f1724; --accent:#ff8a1d; --muted:#99a;
  }
  html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#071020,#0b1220);color:#e6eef8}
  .wrap{max-width:980px;margin:18px auto;padding:14px;background:linear-gradient(180deg,var(--panel),#07101a);border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.6)}
  header{display:flex;justify-content:space-between;align-items:center}
  h1{margin:0;font-size:20px;display:flex;gap:12px;align-items:center}
  .menu, .game-area, .modal{padding:12px}
  button{background:#1f2937;color:#fff;border:0;padding:8px 12px;border-radius:10px;cursor:pointer}
  #gameCanvas{background:#05111a;border-radius:10px;display:block;margin:12px auto}
  .row{display:flex;gap:12px;align-items:center}
  .small{font-size:13px;color:var(--muted)}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .status{margin-top:8px;color:var(--muted)}
  .hud{display:flex;gap:10px;align-items:center}
  .dpad{position:fixed;right:16px;bottom:16px;display:grid;grid-template-columns:70px 70px;gap:6px}
  .dpad button{width:70px;height:70px;border-radius:10px;background:rgba(255,255,255,0.04);font-size:18px;color:#fff}
  .topbar{display:flex;justify-content:space-between;align-items:center}
  .footer{margin-top:8px;color:var(--muted);font-size:13px}
  .level-grid{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto}
  .level-grid button{min-width:48px;padding:6px;border-radius:6px;background:#13202b;color:#cfe}
  .big{font-weight:600;background:linear-gradient(90deg, #2db44f,#2b9);padding:10px 16px;border-radius:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1><span style="width:36px;height:36px;display:inline-block;background:var(--accent);border-radius:8px;"></span> Eat Orange</h1>
    <div class="hud"><div>Level <strong id="ui-level">1</strong>/<span id="ui-max">2000</span></div><div class="small">Score: <span id="ui-score">0</span></div></div>
  </div>

  <div id="menu" class="menu">
    <div style="display:flex;gap:12px;align-items:center">
      <button id="btn-play" class="big">Play</button>
      <button id="btn-continue">Continue</button>
      <button id="btn-levels">Level Select</button>
      <button id="btn-settings">Settings</button>
    </div>
    <div class="small" style="margin-top:8px">Eat oranges to grow, reach the golden exit. Avoid walls and guards. Touch controls appear on mobile.</div>
  </div>

  <div id="gameArea" class="game-area" style="display:none">
    <canvas id="gameCanvas" width="640" height="640"></canvas>
    <div class="controls">
      <button id="btn-restart">Restart Level</button>
      <button id="btn-skip">Skip Level</button>
      <button id="btn-back">Back to Menu</button>
      <label class="small">Speed <input id="speed" type="range" min="6" max="20" value="12"></label>
      <label class="small">Grid <select id="gridSize"><option value="16">16</option><option value="20" selected>20</option><option value="24">24</option></select></label>
    </div>
    <div id="gameStatus" class="status small"></div>
  </div>

  <div id="levelsModal" class="modal" style="display:none">
    <div class="small">Choose level</div>
    <div class="level-grid" id="levelsGrid"></div>
    <div style="margin-top:8px"><button id="closeLevels">Close</button></div>
  </div>

  <div id="settingsModal" class="modal" style="display:none">
    <label>Sound: <input type="checkbox" id="toggleSound" checked></label><br/>
    <label>Vibrate on hit: <input type="checkbox" id="toggleVibrate"></label><br/>
    <div style="margin-top:8px"><button id="closeSettings">Close</button></div>
  </div>

  <div class="footer">Prototype — single-file HTML. Replace this file in your Android WebView project to build APK.</div>
</div>

<!-- D-Pad for touchscreen -->
<div id="dpad" class="dpad" style="display:none">
  <div></div><button id="btn-up">↑</button>
  <button id="btn-left">←</button><button id="btn-down">↓</button>
  <div></div><button id="btn-right">→</button>
</div>

<script>
/* =========================
   Game config & persistence
   ========================= */
const MAX_LEVEL = 2000;
let currentLevel = parseInt(localStorage.getItem('eat_level')||'1',10);
let speed = parseInt(localStorage.getItem('eat_speed')||'12',10);
let gridSize = parseInt(localStorage.getItem('eat_grid')||'20',10);
let soundOn = (localStorage.getItem('eat_sound')||'1')==='1';
let vibrateOn = (localStorage.getItem('eat_vibrate')||'0')==='1';

const ui = {
  level: document.getElementById('ui-level'),
  max: document.getElementById('ui-max'),
  score: document.getElementById('ui-score'),
  status: document.getElementById('gameStatus'),
  canvas: document.getElementById('gameCanvas'),
};

ui.max.textContent = MAX_LEVEL;

/* -------------------------
   Simple audio (WebAudio)
   ------------------------- */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const actx = AudioCtx ? new AudioCtx() : null;
function beep(freq=440,d=0.06){
  if(!soundOn || !actx) return;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type='sine'; o.frequency.value = freq;
  g.gain.value = 0.08;
  o.connect(g); g.connect(actx.destination);
  o.start(); setTimeout(()=>o.stop(), d*1000);
}

/* =========================
   Level generation (procedural)
   - walls + oranges + guards scale with level
   ========================= */
function genConfigForLevel(level){
  const grid = gridSize;
  const oranges = Math.min(80, 3 + Math.floor(level/6));
  const walls = Math.min(Math.floor(grid*grid*0.12), 6 + Math.floor(level*0.7));
  const guards = Math.min(10, Math.floor(level/45));
  const required = 3 + Math.floor(level/35);
  return {grid, oranges, walls, guards, required};
}

/* =========================
   Game engine (snake)
   ========================= */
const canvas = ui.canvas;
const ctx = canvas.getContext('2d');
let gameState = null;
let loop = null;

function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

function createLevel(level){
  const cfg = genConfigForLevel(level);
  const N = cfg.grid;
  const sizePx = Math.min(720, N*30);
  canvas.width = sizePx; canvas.height = sizePx;
  const cell = Math.floor(sizePx/N);
  // grid: 0 empty, 1 wall, 2 orange, 3 exit
  const grid = Array.from({length:N},()=>Array(N).fill(0));
  // border walls
  for(let i=0;i<N;i++){ grid[0][i]=1; grid[N-1][i]=1; grid[i][0]=1; grid[i][N-1]=1; }
  // random walls
  let placed=0, attempts=0;
  while(placed<cfg.walls && attempts<cfg.walls*20){
    attempts++;
    const x=randInt(1,N-2), y=randInt(1,N-2);
    if(grid[y][x]===0){ grid[y][x]=1; placed++; }
  }
  // place exit on an edge
  const edges=[];
  for(let i=1;i<N-1;i++){ edges.push([i,1]); edges.push([i,N-2]); edges.push([1,i]); edges.push([N-2,i]); }
  const exit = edges[randInt(0,edges.length-1)];
  grid[exit[1]][exit[0]] = 3;
  // oranges
  placed=0; attempts=0;
  while(placed<cfg.oranges && attempts<cfg.oranges*60){
    attempts++;
    const x=randInt(1,N-2), y=randInt(1,N-2);
